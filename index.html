<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Power - PMO进度管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
        .app { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 40px; border-radius: 16px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(102,126,234,0.3); }
        .header h1 { font-size: 24px; font-weight: 600; letter-spacing: 1px; }
        .header h1 span { font-weight: 300; opacity: 0.9; }
        .header-actions { display: flex; gap: 12px; }
        .btn { padding: 10px 24px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.3s ease; }
        .btn-primary { background: white; color: #667eea; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,255,255,0.3); }
        .btn-success { background: #52c41a; color: white; }
        .btn-success:hover { background: #45a817; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(82,196,26,0.3); }
        .btn-danger { background: #ff4d4f; color: white; }
        .btn-danger:hover { background: #d9363e; transform: translateY(-2px); }
        .btn-back { background: rgba(255,255,255,0.2); color: white; }
        .btn-back:hover { background: rgba(255,255,255,0.3); }
        .btn-sm { padding: 6px 16px; font-size: 12px; border-radius: 8px; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; transition: all 0.3s ease; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .stat-card .num { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .label { font-size: 14px; color: #999; margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .card.求职::before { background: linear-gradient(90deg, #667eea, #764ba2); }
        .card.找对象::before { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .card-name { font-size: 20px; font-weight: 600; }
        .tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .tag.求职 { background: #eef0ff; color: #667eea; }
        .tag.找对象 { background: #fdeef1; color: #f5576c; }
        .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card-item { text-align: center; padding: 12px; background: #f8f9fc; border-radius: 10px; }
        .card-item .value { font-size: 24px; font-weight: 700; color: #333; }
        .card-item .label { font-size: 12px; color: #999; margin-top: 2px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .status-badge.未开始 { background: #f5f5f5; color: #bbb; }
        .status-badge.进行中 { background: #e6f7ff; color: #1890ff; }
        .status-badge.已完成 { background: #f6ffed; color: #52c41a; }
        .card-footer { margin-top: 16px; display: flex; justify-content: center; }
        .progress-bar { width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px; margin-top: 12px; overflow: hidden; }
        .progress-bar .fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.5s ease; }
        .detail-page { animation: fadeIn 0.15s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .person-header { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .person-header h2 { font-size: 28px; margin-bottom: 8px; }
        .person-header .meta { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .person-header .meta .item { display: flex; align-items: center; gap: 8px; }
        .person-header .meta .item .num { font-size: 20px; font-weight: 700; color: #667eea; }
        .stages { display: flex; flex-direction: column; gap: 16px; }
        .stage-card { background: white; border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.3s ease; border-left: 4px solid #e8e8e8; }
        .stage-card.active { border-left-color: #1890ff; }
        .stage-card.completed { border-left-color: #52c41a; }
        .stage-card.locked { opacity: 0.5; pointer-events: none; }
        .stage-card.locked::after { content: '🔒 上一阶段未完成'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 20px; border-radius: 8px; font-size: 14px; }
        .stage-card.locked { position: relative; overflow: hidden; }
        .stage-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .stage-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .stage-index { width: 28px; height: 28px; border-radius: 50%; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
        .stage-index.completed { background: #52c41a; }
        .stage-index.active { background: #1890ff; }
        .stage-controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .stage-controls input[type="number"] { width: 100px; padding: 8px 12px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.3s; }
        .stage-controls input[type="number"]:focus { border-color: #667eea; }
        .stage-controls select { padding: 8px 12px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 14px; outline: none; background: white; cursor: pointer; }
        .stage-controls select:focus { border-color: #667eea; }
        .stage-threshold { font-size: 12px; color: #999; margin-left: 4px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.2s ease; }
        .modal { background: white; border-radius: 20px; padding: 32px; width: 90%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal h3 { font-size: 22px; margin-bottom: 20px; }
        .modal .form-group { margin-bottom: 16px; }
        .modal .form-group label { display: block; font-size: 14px; font-weight: 500; color: #666; margin-bottom: 6px; }
        .modal .form-group input, .modal .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 14px; outline: none; }
        .modal .form-group input:focus, .modal .form-group select:focus { border-color: #667eea; }
        .modal .modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
        .edit-stage-row { display: flex; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #f0f0f0; }
        .edit-stage-row:last-child { border-bottom: none; }
        .edit-stage-row .stage-name-input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
        .edit-stage-row .stage-name-input:focus { border-color: #667eea; }
        .edit-stage-row .stage-threshold-input { padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; text-align: center; outline: none; }
        .edit-stage-row .stage-threshold-input:focus { border-color: #667eea; }

        .stage-card.drag-over { border-color: #667eea; box-shadow: 0 0 0 2px rgba(102,126,234,0.3); }
        .stage-card.dragging { opacity: 0.5; }
        .modal .btn-cancel { padding: 10px 24px; border: 2px solid #e8e8e8; border-radius: 10px; background: white; cursor: pointer; font-size: 14px; }
        .modal .btn-cancel:hover { background: #f5f5f5; }

        .date-input:focus { border-color: #667eea; }

        .stage-details > div { padding: 0 8px; }
        .stage-details .left-col { border-right: 1px solid #f0f0f0; padding-right: 16px; }
        .stage-details .right-col { padding-left: 16px; }
        .col-header { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .col-header .count { font-size: 11px; color: #bbb; font-weight: 400; margin-left: auto; }
        .add-btn-small { background: none; border: 1px dashed #ccc; border-radius: 8px; padding: 4px 12px; font-size: 12px; color: #999; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .add-btn-small:hover { border-color: #667eea; color: #667eea; background: #f8f9ff; }
        .log-item, .comment-item { background: #f8f9fc; border-radius: 10px; padding: 12px; margin-bottom: 8px; position: relative; }
        .log-item:hover, .comment-item:hover { background: #f0f2f8; }
        .log-meta, .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .log-time { font-size: 11px; color: #bbb; }
        .log-mood { font-size: 12px; padding: 2px 8px; border-radius: 10px; font-weight: 500; display: inline-block; }
        .log-mood.mood-积极 { background: #f6ffed; color: #52c41a; }
        .log-mood.mood-一般 { background: #fffbe6; color: #d48806; }
        .log-mood.mood-消极 { background: #fff2f0; color: #ff4d4f; }
        .log-mood.mood-其他 { background: #f0f5ff; color: #2f54eb; }
        .log-content { font-size: 13px; line-height: 1.6; color: #444; white-space: pre-wrap; word-break: break-word; }
        .log-actions, .comment-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
        .log-item:hover .log-actions, .comment-item:hover .comment-actions, .reply-item:hover .comment-actions { opacity: 1; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 12px; color: #bbb; padding: 2px 5px; border-radius: 4px; line-height: 1; }
        .action-btn:hover { background: #e8e8e8; color: #333; }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: white; flex-shrink: 0; }
        .comment-author { font-size: 13px; font-weight: 500; color: #333; }
        .comment-reaction { font-size: 11px; padding: 1px 8px; border-radius: 8px; background: #f0f5ff; color: #2f54eb; display: inline-block; }
        .comment-text { font-size: 13px; line-height: 1.6; color: #444; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
        .reply-toggle { background: none; border: none; color: #667eea; font-size: 12px; cursor: pointer; padding: 2px 0; margin-top: 4px; }
        .reply-toggle:hover { text-decoration: underline; }
        .replies { margin-left: 24px; margin-top: 8px; padding-left: 12px; border-left: 2px solid #e8e8e8; }
        .reply-item { background: #f8f9fc; border-radius: 8px; padding: 10px; margin-bottom: 6px; position: relative; }
        .reply-item:hover { background: #f0f2f8; }
        .inline-edit-box { width: 100%; padding: 6px 8px; border: 2px solid #667eea; border-radius: 8px; font-size: 13px; outline: none; resize: vertical; min-height: 36px; font-family: inherit; box-sizing: border-box; }
        .inline-edit-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .inline-edit-row button { padding: 4px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .inline-edit-row .save-btn { background: #667eea; color: white; }
        .inline-edit-row .save-btn:hover { background: #5a6fd6; }
        .inline-edit-row .cancel-btn { background: #f0f0f0; color: #666; }
        .inline-edit-row .cancel-btn:hover { background: #e0e0e0; }
        .small-select { padding: 3px 6px; border: 2px solid #667eea; border-radius: 6px; font-size: 12px; outline: none; background: white; }
        .small-input { padding: 3px 8px; border: 2px solid #667eea; border-radius: 6px; font-size: 12px; outline: none; width: 120px; }
        .add-log-form, .add-comment-form { background: #f8f9fc; border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #e8e8e8; }
        .add-log-form textarea, .add-comment-form textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; resize: vertical; min-height: 50px; font-family: inherit; outline: none; box-sizing: border-box; }
        .add-log-form textarea:focus, .add-comment-form textarea:focus { border-color: #667eea; }
        .no-data-tip { text-align: center; padding: 16px; color: #ccc; font-size: 13px; }
        .reply-form { margin-left: 24px; margin-top: 6px; padding: 10px; background: #f8f9fc; border-radius: 8px; border: 1px solid #e8e8e8; }
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
            .grid { grid-template-columns: 1fr; }
            .stage-controls { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="app" id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
// ==================== SUPABASE CONFIG ====================
const SUPABASE_URL = 'https://hikmgzhhoyenptmmljgx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhpa21nemhob3llbnB0bW1samd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjE5NzYsImV4cCI6MjA5NjE5Nzk3Nn0.1nOVokhJ9gDDEiJ3Ojt6Zah80wxf83NmWEoweLO3Eg4';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==================== DATA CONFIG ====================
const DEFAULT_THRESHOLDS = {
job: {
    0: { threshold: 1, label: '完成即进入' },
    1: { threshold: 1, label: '≥1人即进行中' },
    2: { threshold: 10, label: '≥10次即已完成' },
    3: { threshold: 20, label: '≥20家即已完成' },
    4: { threshold: 1, label: '≥1次即进行中' },
    5: { threshold: 1, label: '≥1次即进行中' },
    6: { threshold: 1, label: '≥1次即进行中' },
    7: { threshold: 1, label: '完成即进入' },
  },
  love: {
    0: { threshold: 1, label: '完成即进入' },
    1: { threshold: 3, label: '≥3种渠道即进行中' },
    2: { threshold: 5, label: '≥5人即进行中' },
    3: { threshold: 10, label: '≥10次即进行中' },
    4: { threshold: 3, label: '≥3次即进行中' },
    5: { threshold: 1, label: '完成即进入' },
    6: { threshold: 1, label: '完成即进入' },
}
};

const JOB_STAGES = [
  { name: '撰写中英文简历', hasNumber: false, key: 'resume' },
  { name: '添加猎头联系方式', hasNumber: true, key: 'hunter', defaultThreshold: 5 },
  { name: '与猎头/友人沟通工作机会', hasNumber: true, key: 'communicate', defaultThreshold: 10 },
  { name: '向公司投出简历', hasNumber: true, key: 'apply', defaultThreshold: 20 },
  { name: '公司一轮面试', hasNumber: true, key: 'interview1', defaultThreshold: 1 },
  { name: '公司二轮及终面面试', hasNumber: true, key: 'interview2', defaultThreshold: 1 },
  { name: '谈薪', hasNumber: true, key: 'salary', defaultThreshold: 1 },
  { name: '接受Offer并从现公司离职', hasNumber: false, key: 'resign' },
];

const LOVE_STAGES = [
  { name: '个人形象优化', hasNumber: false, key: 'appearance' },
  { name: '拓展社交渠道', hasNumber: true, key: 'social', defaultThreshold: 3 },
  { name: '新增异性联系人', hasNumber: true, key: 'contacts', defaultThreshold: 5 },
  { name: '日常沟通互动', hasNumber: true, key: 'chat', defaultThreshold: 10 },
  { name: '线下见面约会', hasNumber: true, key: 'date', defaultThreshold: 3 },
  { name: '深度相处磨合', hasNumber: false, key: 'deepen' },
  { name: '确定恋爱关系', hasNumber: false, key: 'commit' },
];

// ==================== SUPABASE HELPERS ====================
let state = { currentPage: 'home', currentPersonId: null, data: { persons: [], progresses: {} } };

async function ensurePersonsTable() {
  const { error } = await supabase.rpc('create_persons_table_if_not_exists');
  if (error) console.warn('Table check rpc not available, will use insert with upsert');
}

async function loadData() {
  const { data, error } = await supabase.from('persons').select('*');
  if (error) { console.error('loadData error:', error); state.data = { persons: [], progresses: {} }; return; }
  if (!data || data.length === 0) {
    const defaults = [
      { id: 'xlh', name: '向龙一', track: '求职', start_date: new Date().toISOString().split('T')[0] },
      { id: 'ztr', name: '赵陶然', track: '求职', start_date: new Date().toISOString().split('T')[0] },
      { id: 'hq', name: '黄群', track: '找对象', start_date: new Date().toISOString().split('T')[0] },
    ];
    const { error: insErr } = await supabase.from('persons').insert(defaults);
    if (insErr) console.error('Insert defaults error:', insErr);
    state.data = { persons: defaults, progresses: {} };
    return;
  }
  const persons = data.map(r => ({ id: r.id, name: r.name, track: r.track, startDate: r.start_date }));
  const { data: progData, error: progErr } = await supabase.from('progresses').select('*');
  const progresses = {};
  if (!progErr && progData) {
    progData.forEach(r => { progresses[r.person_id] = { stages: r.stages || {} }; });
  }
  state.data = { persons, progresses };
}

async function saveData() {
  for (const p of state.data.persons) {
    // Check if person exists first
    const { data: existingPerson } = await supabase.from('persons').select('id').eq('id', p.id).maybeSingle();
    if (existingPerson) {
      await supabase.from('persons').update({ name: p.name, track: p.track, start_date: p.startDate }).eq('id', p.id);
    } else {
      await supabase.from('persons').insert({ id: p.id, name: p.name, track: p.track, start_date: p.startDate });
    }
  }
  for (const [personId, prog] of Object.entries(state.data.progresses)) {
    const { data: existingProg } = await supabase.from('progresses').select('person_id').eq('person_id', personId).maybeSingle();
    if (existingProg) {
      await supabase.from('progresses').update({ stages: prog.stages || {} }).eq('person_id', personId);
    } else {
      await supabase.from('progresses').insert({ person_id: personId, stages: prog.stages || {} });
    }
  }
}

async function loadThresholds() {
  const { data, error } = await supabase.from('thresholds').select('*').maybeSingle();
  if (error || !data) return JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS));
  return data.config;
}

async function saveThresholds(thresholds) {
  const { data: existing } = await supabase.from('thresholds').select('id').eq('id', 1).maybeSingle();
  if (existing) {
    await supabase.from('thresholds').update({ config: thresholds }).eq('id', 1);
  } else {
    await supabase.from('thresholds').insert({ id: 1, config: thresholds });
  }
}

function getStagesForTrack(person) {
  if (!person) { console.log('getStagesForTrack: person is null'); return []; }
  if (person.track === '求职') return JOB_STAGES;
  if (person.track === '找对象') return LOVE_STAGES;
  // 自定义赛道：从 progresses 中读取 stage_defs
  const p = state.data.progresses[person.id];
  console.log('getStagesForTrack custom:', person.id, person.track, 'stages data:', p);
  if (p && p.stages && p.stages.stage_defs && p.stages.stage_defs.length > 0) return p.stages.stage_defs;
  return [{ name: '尚未定义阶段', hasNumber: false, key: 'placeholder' }];
}

async function getStageStatus(personId, stageIndex, stages, thresholds) {
  const p = state.data.progresses[personId];
  if (!p || !p.stages) return '未开始';
  const s = p.stages[stageIndex];
  if (!s) return '未开始';
  if (s.manualStatus) return s.manualStatus;
  if (s.status) return s.status;
  const stage = stages[stageIndex];
  if (!stage) return '未开始';
  if (!stage.hasNumber) return '未开始';
  const val = s.value || 0;
  if (val === 0) return '未开始';
  const person = state.data.persons.find(pr => pr.id === personId);
  // 自定义赛道：阈值从 stage_def 的 threshold 取
  let thresholdVal = stage.defaultThreshold || 1;
  if (stage.threshold !== undefined) thresholdVal = stage.threshold;
  if (!person || person.track === '求职' || person.track === '找对象') {
    const trackKey = person?.track === '求职' ? 'job' : 'love';
    const th = thresholds[trackKey] && thresholds[trackKey][stageIndex];
    if (th) thresholdVal = th.threshold;
  }
  if (thresholdVal >= 10) return val >= thresholdVal ? '已完成' : '进行中';
  if (thresholdVal >= 5) return val >= thresholdVal ? '已完成' : '进行中';
  if (thresholdVal === 3) return val >= thresholdVal ? '进行中' : (val > 0 ? '进行中' : '未开始');
  if (thresholdVal === 1) return '进行中';
  return val > 0 ? '进行中' : '未开始';
}

async function calculateProgress(personId) {
  const person = state.data.persons.find(p => p.id === personId);
  if (!person) return { percent: 0, completed: 0, total: 0, status: '未开始' };
  const stages = getStagesForTrack(person);
  const thresholds = await loadThresholds();
  let completed = 0, started = false;
  for (let idx = 0; idx < stages.length; idx++) {
    const st = await getStageStatus(personId, idx, stages, thresholds);
    if (st === '已完成') completed++;
    if (st !== '未开始') started = true;
  }
  const total = stages.length;
  const percent = total > 0 ? Math.round((completed / total) * 1000) / 10 : 0;
  let status = '未开始';
  if (completed === total) status = '已完成';
  else if (started) status = '进行中';
  return { percent, percentDisplay: percent.toFixed(1), completed, total, status };
}

function calculateDays(startDateStr) {
  if (!startDateStr) return 0;
  const start = new Date(startDateStr);
  const now = new Date();
  return Math.max(0, Math.floor((now - start) / (1000 * 60 * 60 * 24)));
}

async function isStageLocked(personId, stageIndex) {
  if (stageIndex === 0) return false;
  const person = state.data.persons.find(p => p.id === personId);
  if (!person) return true;
  const stages = getStagesForTrack(person);
  const thresholds = await loadThresholds();
  const prevStatus = await getStageStatus(personId, stageIndex - 1, stages, thresholds);
  return prevStatus !== '已完成';
}

// ==================== DRAG & DROP ====================
let dragSourceIdx = null;

function onDragStart(e) {
  dragSourceIdx = parseInt(e.target.dataset.stageIdx);
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.stage-card.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSourceIdx = null;
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (target.dataset.stageIdx !== String(dragSourceIdx)) {
    target.classList.add('drag-over');
  }
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function onDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetIdx = parseInt(e.currentTarget.dataset.stageIdx);
  if (dragSourceIdx === null || dragSourceIdx === targetIdx) return;

  const personId = state.currentPersonId;
  const person = state.data.persons.find(p => p.id === personId);
  if (!person || person.track === '求职' || person.track === '找对象') return;
  const p = state.data.progresses[personId];
  if (!p || !p.stages || !p.stages.stage_defs) return;

  const defs = p.stages.stage_defs;
  const [moved] = defs.splice(dragSourceIdx, 1);
  defs.splice(targetIdx, 0, moved);

  // Rebuild stages progress data
  const newStages = { stage_defs: defs };
  for (let i = 0; i < defs.length; i++) {
    const oldIdx = i === dragSourceIdx ? targetIdx : (i < Math.min(dragSourceIdx, targetIdx) || i > Math.max(dragSourceIdx, targetIdx) ? i : (i + (dragSourceIdx < targetIdx ? -1 : 1)));
    // Simpler approach: try each possible old index
    for (const possibleOld of [i, dragSourceIdx, targetIdx]) {
      if (p.stages[possibleOld] !== undefined && !newStages[i]) {
        // Check if this old stage belongs to this new position
        const oldDefIdx = defs.indexOf(moved);
        if (possibleOld === oldDefIdx) continue;
      }
    }
    if (p.stages[oldIdx] !== undefined) newStages[i] = p.stages[oldIdx];
  }
  // Direct approach: just swap values
  const oldData = {};
  for (const [k, v] of Object.entries(p.stages)) {
    if (k === 'stage_defs') continue;
    oldData[parseInt(k)] = v;
  }
  const newData = {};
  const keys = Object.keys(oldData).map(Number).sort((a,b) => a-b);
  for (let i = 0; i < defs.length; i++) {
    if (i < keys.length && oldData[keys[i]] !== undefined) {
      newData[i] = oldData[keys[i]];
    }
  }
  newData.stage_defs = defs;
  p.stages = newData;
  await saveData();
  renderDetail(personId);
}

async function updateStageValue(personId, stageIndex, value) {
  if (!state.data.progresses[personId]) state.data.progresses[personId] = { stages: {} };
  const s = state.data.progresses[personId].stages;
  if (!s[stageIndex]) s[stageIndex] = { value: 0, status: '未开始', manualStatus: null };
  s[stageIndex].value = parseInt(value) || 0;
  s[stageIndex].manualStatus = null;
  await saveData();
  await renderDetail(personId, true);
}

async function updateStageStatus(personId, stageIndex, status) {
  if (!state.data.progresses[personId]) state.data.progresses[personId] = { stages: {} };
  const s = state.data.progresses[personId].stages;
  if (!s[stageIndex]) s[stageIndex] = { value: 0, status: '未开始', manualStatus: null };
  s[stageIndex].manualStatus = status;
  s[stageIndex].status = status;
  // Check if record exists, then update or insert
  const { data: existing } = await supabase.from('progresses').select('person_id').eq('person_id', personId).maybeSingle();
  if (existing) {
    await supabase.from('progresses').update({ stages: state.data.progresses[personId].stages }).eq('person_id', personId);
  } else {
    await supabase.from('progresses').insert({ person_id: personId, stages: state.data.progresses[personId].stages });
  }
  await renderDetail(personId, true);
}

      </label>
      <input class="stage-threshold-input" type="number" min="1" value="${d.threshold || d.defaultThreshold || 1}" placeholder="阈值" data-idx="${i}" style="width:60px;">
      <button class="config-btn" style="color:#ff4d4f;" onclick="removeEditStageRow(this)">✕</button>
    </div>
  `).join('');

  overlay.innerHTML = `
    <div class="modal" style="max-width:600px;">
      <h3>✏️ 编辑阶段 - ${escapeHtml(person.track)}</h3>
      <div id="edit-stages-list">
        ${defsHtml || '<div style="color:#999;padding:16px;text-align:center;">暂无阶段，请添加</div>'}
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-primary btn-sm" onclick="addEditStageRow()">➕ 添加阶段</button>
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="confirmEditStages('${personId}')">保存阶段</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function addEditStageRow() {
  const list = document.getElementById('edit-stages-list');
  const emptyMsg = list.querySelector('div[style*="text-align:center"]');
  if (emptyMsg) emptyMsg.remove();
  const row = document.createElement('div');
  row.className = 'edit-stage-row';
  row.innerHTML = `
    <span class="drag-handle" style="cursor:grab;font-size:16px;color:#999;">⠿</span>
    <input class="stage-name-input" placeholder="阶段名称">
    <label style="font-size:12px;white-space:nowrap;color:#aaa;">
      <input type="checkbox" class="stage-has-num"> 有数字
    </label>
    <input class="stage-threshold-input" type="number" min="1" value="1" placeholder="阈值" style="width:60px;">
    <button class="config-btn" style="color:#ff4d4f;" onclick="removeEditStageRow(this)">✕</button>
  `;
  list.appendChild(row);
}

function removeEditStageRow(btn) {
  const row = btn.closest('.edit-stage-row');
  const list = document.getElementById('edit-stages-list');
  row.remove();
  if (list.children.length === 0) {
    list.innerHTML = '<div style="color:#999;padding:16px;text-align:center;">暂无阶段，请添加</div>';
  }
}

async function confirmEditStages(personId) {
  const rows = document.querySelectorAll('#edit-stages-list .edit-stage-row');
  const defs = [];
  for (const row of rows) {
    const nameInput = row.querySelector('.stage-name-input');
    const name = nameInput.value.trim();
    if (!name) continue;
    const hasNum = row.querySelector('.stage-has-num').checked;
    const thresholdInput = row.querySelector('.stage-threshold-input');
    const threshold = thresholdInput ? parseInt(thresholdInput.value) || 1 : 1;
    defs.push({ name, hasNumber: hasNum, threshold, key: 'custom_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5) });
  }
  if (defs.length === 0) { alert('请至少添加一个阶段'); return; }
  if (!state.data.progresses[personId]) state.data.progresses[personId] = { stages: { stage_defs: [] } };
  const oldStages = state.data.progresses[personId].stages || {};
  const newStages = { stage_defs: defs };
  for (const [key, val] of Object.entries(oldStages)) {
    if (key === 'stage_defs') continue;
    const idx = parseInt(key);
    if (!isNaN(idx) && idx < defs.length) {
      newStages[key] = val;
    }
  }
  state.data.progresses[personId].stages = newStages;
  await saveData();
  document.querySelector('.modal-overlay').remove();
  renderDetail(personId);
}

async function deleteStageDef(personId, stageIndex) {
  if (!confirm('确定删除这个阶段及其所有进度数据吗？')) return;
  const person = state.data.persons.find(p => p.id === personId);
  if (!person || person.track === '求职' || person.track === '找对象') return;
  const p = state.data.progresses[personId];
  if (!p || !p.stages || !p.stages.stage_defs) return;
  const defs = p.stages.stage_defs;
  if (stageIndex < 0 || stageIndex >= defs.length) return;
  defs.splice(stageIndex, 1);
  const newStages = { stage_defs: defs };
  for (let i = 0; i < defs.length; i++) {
    const oldIdx = i < stageIndex ? i : i + 1;
    if (p.stages[oldIdx]) newStages[i] = p.stages[oldIdx];
  }
  p.stages = newStages;
  await saveData();
  renderDetail(personId);
}

async function resetData() {
  if (!confirm('确定要重置所有数据吗？（将恢复到初始示例数据）')) return;
  // Delete all data from supabase
  await supabase.from('persons').delete().neq('id', '__dummy__');
  await supabase.from('progresses').delete().neq('person_id', '__dummy__');
  await supabase.from('logs').delete().neq('id', 0);
  await supabase.from('comments').delete().neq('id', 0);
  await supabase.from('thresholds').delete().neq('id', 0);
  state.data = { persons: [], progresses: {} };
  // Insert defaults
  const defaults = [
    { id: 'xlh', name: '向龙一', track: '求职', start_date: new Date().toISOString().split('T')[0] },
    { id: 'ztr', name: '赵陶然', track: '求职', start_date: new Date().toISOString().split('T')[0] },
    { id: 'hq', name: '黄群', track: '找对象', start_date: new Date().toISOString().split('T')[0] },
  ];
  await supabase.from('persons').insert(defaults);
  renderHome();
}

async function showThresholdConfig(personId, stageIndex) {
  const person = state.data.persons.find(p => p.id === personId);
  if (!person) return;
  const trackKey = person.track === '求职' ? 'job' : 'love';
  const stages = getStagesForTrack(person);
  const stage = stages[stageIndex];
  const thresholds = await loadThresholds();
  const current = (thresholds[trackKey] && thresholds[trackKey][stageIndex])
    ? thresholds[trackKey][stageIndex].threshold
    : (stage.defaultThreshold || 1);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>⚙️ 修改阈值</h3>
      <p style="color:#666;margin-bottom:16px;">阶段：${stage.name}</p>
      <div class="form-group">
        <label>量化阈值</label>
        <input type="number" id="thresholdInput" value="${current}" min="1">
        <span style="font-size:12px;color:#999;margin-top:4px;display:block;">达到该数值时自动判定为进行中/已完成</span>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="confirmThresholdConfig('${personId}', ${stageIndex})">确认修改</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

async function confirmThresholdConfig(personId, stageIndex) {
  const val = parseInt(document.getElementById('thresholdInput').value);
  if (!val || val < 1) { alert('请输入有效的阈值（≥1）'); return; }
  const person = state.data.persons.find(p => p.id === personId);
  if (!person) return;
  const trackKey = person.track === '求职' ? 'job' : 'love';
  const thresholds = await loadThresholds();
  if (!thresholds[trackKey]) thresholds[trackKey] = {};
  if (!thresholds[trackKey][stageIndex]) thresholds[trackKey][stageIndex] = {};
  thresholds[trackKey][stageIndex].threshold = val;
  await saveThresholds(thresholds);
  document.querySelector('.modal-overlay').remove();
  renderDetail(personId);
}

// ==================== LOG RENDERERS ====================
async function renderLogs(personId, stageIndex) {
  const area = document.getElementById(`log-area-${personId}-${stageIndex}`);
  const countEl = document.getElementById(`log-count-${personId}-${stageIndex}`);
  if (!area) return;
  area.innerHTML = '<div class="no-data-tip">加载中...</div>';
  const logs = await loadLogs(personId, stageIndex);
  if (countEl) countEl.textContent = `(${logs.length})`;
  if (logs.length === 0) { area.innerHTML = '<div class="no-data-tip">暂无日志</div>'; return; }
  area.innerHTML = logs.map(log => {
    const moodClass = log.mood ? `mood-${log.mood}` : '';
    return `
      <div class="log-item" id="log-item-${log.id}">
        <div class="log-meta">
          <span class="log-time">${formatTime(log.created_at)}</span>
          <span class="log-mood ${moodClass}">${log.mood || '一般'}</span>
        </div>
        <div class="log-content">${escapeHtml(log.content)}</div>
        <div class="log-actions">
          <button class="action-btn" onclick="editLog('${log.id}', '${personId}', ${stageIndex})">✏️</button>
          <button class="action-btn" onclick="deleteLogConfirm('${log.id}', '${personId}', ${stageIndex})">🗑</button>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showAddLogForm(personId, stageIndex) {

function cancelAddLog(personId, stageIndex) {

}

async function confirmAddLog(personId, stageIndex) {
  const content = document.getElementById(`log-content-${personId}-${stageIndex}`)?.value.trim();

  const metaEl = item.querySelector('.log-meta');

async function confirmEditLog(logId, personId, stageIndex) {

  const mood = document.getElementById(`edit-log-mood-${logId}`)?.value || '一般';
  await updateLog(logId, content, mood);
  renderLogs(personId, stageIndex);

async function deleteLogConfirm(logId, personId, stageIndex) {
  if (!confirm('确定删除这条日志吗？')) return;
  await deleteLog(logId);
  renderLogs(personId, stageIndex);
}

// ==================== COMMENT RENDERERS ====================
async function renderComments(personId, stageIndex) {
  const area = document.getElementById(`comment-area-${personId}-${stageIndex}`);
  const countEl = document.getElementById(`comment-count-${personId}-${stageIndex}`);
  if (!area) return;
  area.innerHTML = '<div class="no-data-tip">加载中...</div>';
  const comments = await loadComments(personId, stageIndex);
  if (countEl) countEl.textContent = `(${comments.length})`;
  if (comments.length === 0) { area.innerHTML = '<div class="no-data-tip">暂无评论</div>'; return; }

  // Build tree: top-level comments and their replies
  const topLevel = comments.filter(c => !c.parent_id);
  const replies = {};
  comments.filter(c => c.parent_id).forEach(c => {
    if (!replies[c.parent_id]) replies[c.parent_id] = [];
    replies[c.parent_id].push(c);
  });

  area.innerHTML = topLevel.map(comment => buildCommentHtml(comment, replies, personId, stageIndex)).join('');
}

function buildCommentHtml(comment, replies, personId, stageIndex) {
  const avatarColors = ['#667eea','#764ba2','#f093fb','#f5576c','#52c41a','#1890ff','#d48806','#ff4d4f'];
  const colorIdx = comment.id ? comment.id.toString().length % avatarColors.length : 0;
  const initial = '我';

  let html = `
    <div class="comment-item" id="comment-item-${comment.id}">
      <div class="comment-meta">
        <span class="comment-avatar" style="background:${avatarColors[colorIdx]}">${initial}</span>
        <span class="comment-author">我自己</span>
        <span class="log-time">${formatTime(comment.created_at)}</span>
        <span class="comment-reaction">💬</span>
      </div>
      <div class="comment-text">${escapeHtml(comment.content)}</div>
      <div class="comment-actions">
        <button class="action-btn" onclick="editComment('${comment.id}', '${personId}', ${stageIndex})">✏️</button>
        <button class="action-btn" onclick="deleteCommentConfirm('${comment.id}', '${personId}', ${stageIndex})">🗑</button>
      </div>
      <button class="reply-toggle" onclick="showReplyForm('${comment.id}', '${personId}', ${stageIndex})">💬 回复</button>
      <div id="reply-form-${comment.id}" style="display:none;"></div>
      <div class="replies" id="replies-${comment.id}">
  `;

  if (replies[comment.id]) {
    replies[comment.id].forEach(reply => {
      html += `
        <div class="reply-item" id="comment-item-${reply.id}">
          <div class="comment-meta">
            <span class="log-time">${formatTime(reply.created_at)}</span>
            <span class="comment-author">我自己</span>
          </div>
          <div class="comment-text">${escapeHtml(reply.content)}</div>
          <div class="comment-actions">
            <button class="action-btn" onclick="editComment('${reply.id}', '${personId}', ${stageIndex})">✏️</button>
            <button class="action-btn" onclick="deleteCommentConfirm('${reply.id}', '${personId}', ${stageIndex})">🗑</button>
          </div>
        </div>
      `;
    });
  }

  html += '</div></div>';
  return html;
}

  const formId = `comment-form-${personId}-${stageIndex}`;
